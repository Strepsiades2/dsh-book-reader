# dsh-book-reader bundle patch: mount the plugin into the active profile.
# Host half: pdf_info / pdf_search / pdf_read_pages tools,
#            /dsh-book-reader/* routes, and a minimal per-turn reading-position
#            line injected through agent/pre-step.
# Browser half: page readout, jump, search panel, and share-to-chat on top of
#               the official PDF preview's document-header slot.
#
# All config keys are optional. The defaults shown are the shipped behavior.
- insert:
    - id: pdf-reader
      name: 'dsh-book-reader'
      # config:
      #   enabled: true
      #   autoShare: true                 # false stops position hints
      #   autoShareSection: true          # include the outline section in the line
      #   autoShareMinIntervalMs: 0       # optional: min ms between hints (0 = no time throttle)
      #   autoSharePageDelta: 1           # require a page change before another hint
      #   autoShareMaxAgeMs: 0            # 0 = no age limit on a reported position
      #   allowOutsideWorkspace: false    # tools may only read inside the session cwd
#   routeAllowedRoots: []           # extra dirs the HTTP routes may serve; [] = any
#   maxPagesPerCall: 4              # hard cap per pdf_read_pages call
      #   defaultScale: 2.5               # ~180 DPI; never useful above ~2.7
      #   maxTextCharsPerPage: 1200       # text kept per page (0 disables)
      #   maxSearchResults: 100
      #   maxOutlineEntries: 500
      #   maxLabels: 0                    # 0 = omit page labels (cheapest)
      #   outlineDepth: 1                 # 0=chapters, 1=sections, 2=subsections
      #   debugCost: false                # append JSON cost lines to .debug-cost.log
      #   debug: false                    # include error detail in HTTP 500 bodies
      #   maxFileBytes: 268435456         # 256 MiB
